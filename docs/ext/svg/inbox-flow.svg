<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img"
     aria-label="投稿区机制：贡献者只需写 Markdown 并填写 index.json 放入 inbox/ 目录，无需本地环境；维护者校验、装配、构建并上线">
  <title>投稿区机制：零门槛投稿，顺带装配上线</title>
  <desc>流程分两段。贡献者侧无需任何本地环境：写 Markdown 正文、填 index.json 索引、放进 inbox/ 投稿文件夹，可通过网页上传、Pull Request 或 Issue 附件提交。交付点为 inbox/&lt;投稿 id&gt;/ 下的 index.json 与 index.md。维护者侧负责校验、装配到 docs/、登记导航并构建全站（约 850 秒）、上线并重新生成 sitemap。</desc>

  <defs>
    <linearGradient id="inboxDelivery" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="50%" stop-color="#7f6fe0"/>
      <stop offset="100%" stop-color="#c76fb8"/>
    </linearGradient>
    <marker id="inboxArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8892a6"/>
    </marker>
  </defs>

  <!-- ── 贡献者侧 ──────────────────────────────────────────── -->
  <text x="32" y="34" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#5b8def">贡献者侧 · 无需安装任何环境，不碰构建</text>

  <rect x="32" y="50" width="272" height="88" rx="10" fill="#5b8def"/>
  <text x="168" y="80" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#ffffff">① 写 Markdown 正文</text>
  <text x="168" y="104" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#eef2ff">普通 md，按写作规范写</text>
  <text x="168" y="124" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#eef2ff">不写 YAML front matter</text>

  <line x1="304" y1="94" x2="340" y2="94" stroke="#8892a6" stroke-width="2" marker-end="url(#inboxArrow)"/>

  <rect x="344" y="50" width="272" height="88" rx="10" fill="#6f7ae5"/>
  <text x="480" y="80" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#ffffff">② 填 index.json 索引</text>
  <text x="480" y="104" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#eef2ff">标题 · 作者 · target · nav</text>
  <text x="480" y="124" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#eef2ff">status 改为 ready</text>

  <line x1="616" y1="94" x2="652" y2="94" stroke="#8892a6" stroke-width="2" marker-end="url(#inboxArrow)"/>

  <rect x="656" y="50" width="272" height="88" rx="10" fill="#7f6fe0"/>
  <text x="792" y="80" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#ffffff">③ 放进 inbox/ 投稿夹</text>
  <text x="792" y="104" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#eef2ff">文件夹名 = 投稿 id</text>
  <text x="792" y="124" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#eef2ff">网页上传 / PR / Issue</text>

  <line x1="792" y1="138" x2="792" y2="158" stroke="#8892a6" stroke-width="2"/>
  <line x1="480" y1="158" x2="792" y2="158" stroke="#8892a6" stroke-width="2"/>
  <line x1="480" y1="158" x2="480" y2="170" stroke="#8892a6" stroke-width="2" marker-end="url(#inboxArrow)"/>

  <!-- ── 交付点 ────────────────────────────────────────────── -->
  <rect x="330" y="174" width="300" height="64" rx="12" fill="url(#inboxDelivery)"/>
  <text x="480" y="201" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13.5" font-weight="700" fill="#ffffff">交付点：inbox/&lt;投稿 id&gt;/</text>
  <text x="480" y="222" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#eef2ff">index.json + index.md（可含 images/）</text>

  <line x1="480" y1="238" x2="480" y2="272" stroke="#8892a6" stroke-width="2" marker-end="url(#inboxArrow)"/>

  <!-- ── 维护者侧 ──────────────────────────────────────────── -->
  <text x="32" y="292" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#c76fb8">维护者侧 · 在下一次构建时顺带装配，复杂依赖由维护者承担</text>

  <rect x="32" y="308" width="206" height="88" rx="10" fill="#7f6fe0"/>
  <text x="135" y="338" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#ffffff">④ 校验投稿</text>
  <text x="135" y="362" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">apply_inbox.py --check</text>
  <text x="135" y="382" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">错误在 PR 中指出</text>

  <line x1="238" y1="352" x2="258" y2="352" stroke="#8892a6" stroke-width="2" marker-end="url(#inboxArrow)"/>

  <rect x="262" y="308" width="206" height="88" rx="10" fill="#9a6fd0"/>
  <text x="365" y="338" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#ffffff">⑤ 装配到 docs/</text>
  <text x="365" y="362" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">--apply 自动落点</text>
  <text x="365" y="382" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">回写实际路径与状态</text>

  <line x1="468" y1="352" x2="488" y2="352" stroke="#8892a6" stroke-width="2" marker-end="url(#inboxArrow)"/>

  <rect x="492" y="308" width="206" height="88" rx="10" fill="#b06fc8"/>
  <text x="595" y="338" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#ffffff">⑥ 登记导航并构建</text>
  <text x="595" y="362" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">mkdocs.yml 的 nav</text>
  <text x="595" y="382" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">全站构建约 850 秒</text>

  <line x1="698" y1="352" x2="718" y2="352" stroke="#8892a6" stroke-width="2" marker-end="url(#inboxArrow)"/>

  <rect x="722" y="308" width="206" height="88" rx="10" fill="#c76fb8"/>
  <text x="825" y="338" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#ffffff">⑦ 上线并收录</text>
  <text x="825" y="362" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">推送后 1 分钟内生效</text>
  <text x="825" y="382" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">重新生成 sitemap</text>

  <!-- ── 页脚说明 ──────────────────────────────────────────── -->
  <line x1="32" y1="424" x2="928" y2="424" stroke="#dde3ee" stroke-width="1.5"/>
  <text x="32" y="448" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11.5" fill="#8892a6">投稿者交付的只有纯文本：md 与 json 都可 diff、可评审、可回滚，不需要任何运行时依赖。</text>
  <text x="32" y="470" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11.5" fill="#8892a6">装配与构建被集中到维护者一侧，一次构建服务多份投稿，写作与构建彻底解耦。</text>
</svg>
