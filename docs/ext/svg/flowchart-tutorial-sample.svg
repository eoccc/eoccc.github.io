<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img"
     aria-label="流程图绘制示例：开始 → 执行操作 → 通过判断 → 结束，未通过时回流到执行操作">
  <title>流程图绘制示例</title>
  <desc>最小可用的流程图：圆角矩形表示开始与结束，矩形表示处理步骤，菱形表示条件判断；判断未通过时经虚线回流至处理步骤。</desc>

  <defs>
    <marker id="flowchartSampleArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8892a6"/>
    </marker>
  </defs>

  <!-- 起点：胶囊形圆角矩形 -->
  <rect x="20" y="90" width="120" height="56" rx="28" fill="#5b8def"/>
  <text x="80" y="122" text-anchor="middle" dominant-baseline="middle"
        font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#ffffff">开始</text>

  <!-- 连线：起点 → 处理 -->
  <line x1="144" y1="118" x2="176" y2="118" stroke="#8892a6" stroke-width="2"
        marker-end="url(#flowchartSampleArrow)"/>

  <!-- 处理节点 -->
  <rect x="180" y="90" width="140" height="56" rx="8" fill="#7f6fe0"/>
  <text x="250" y="122" text-anchor="middle" dominant-baseline="middle"
        font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#ffffff">执行操作</text>

  <!-- 连线：处理 → 判断 -->
  <line x1="324" y1="118" x2="326" y2="118" stroke="#8892a6" stroke-width="2"/>
  <polygon points="326,113 336,118 326,123" fill="#8892a6"/>

  <!-- 判断节点：菱形 -->
  <polygon points="400,70 470,118 400,166 330,118" fill="#7f6fe0"/>
  <text x="400" y="120" text-anchor="middle" dominant-baseline="middle"
        font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#ffffff">通过？</text>

  <!-- 连线：判断 → 结束（是） -->
  <line x1="474" y1="118" x2="576" y2="118" stroke="#8892a6" stroke-width="2"
        marker-end="url(#flowchartSampleArrow)"/>
  <text x="525" y="108" text-anchor="middle"
        font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8892a6">是</text>

  <!-- 结束节点 -->
  <rect x="580" y="90" width="120" height="56" rx="28" fill="#c76fb8"/>
  <text x="640" y="122" text-anchor="middle" dominant-baseline="middle"
        font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="14" fill="#ffffff">结束</text>

  <!-- 回流：判断未通过 → 执行操作（虚线，绕行下方） -->
  <polyline points="400,166 400,214 250,214 250,150" fill="none" stroke="#8892a6"
            stroke-width="2" stroke-dasharray="6 5" marker-end="url(#flowchartSampleArrow)"/>
  <text x="325" y="206" text-anchor="middle"
        font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#8892a6">否</text>
</svg>
