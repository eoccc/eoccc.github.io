<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img"
     aria-label="HJSON 相对 JSON 放宽的四个主要方面：注释、无引号键名、省略逗号、多行字符串">
  <title>HJSON 相对 JSON 放宽的四个方面</title>
  <desc>左列为 JSON 写法，右列为等价的 HJSON 写法：HJSON 支持注释、键名可不加引号、可省略逗号、支持三引号多行字符串。</desc>

  <text x="16" y="26" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#8892a6">JSON</text>
  <text x="500" y="26" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#5b8def">HJSON（等价写法）</text>

  <!-- 1 注释 -->
  <text x="16" y="60" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7f6fe0">① 注释</text>
  <rect x="16" y="70" width="440" height="62" rx="6" fill="none" stroke="#8892a6" stroke-width="1.3"/>
  <text x="32" y="96" font-family="Roboto Mono, monospace" font-size="12" fill="#333">{ "health": 150 }</text>
  <text x="32" y="118" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#c62828">✗ 不能写注释</text>

  <rect x="500" y="70" width="444" height="62" rx="6" fill="none" stroke="#5b8def" stroke-width="1.3"/>
  <text x="516" y="96" font-family="Roboto Mono, monospace" font-size="12" fill="#8892a6">// 生命值</text>
  <text x="516" y="118" font-family="Roboto Mono, monospace" font-size="12" fill="#333">{ health: 150 }</text>

  <!-- 2 无引号键名 -->
  <text x="16" y="168" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7f6fe0">② 键名引号</text>
  <rect x="16" y="178" width="440" height="56" rx="6" fill="none" stroke="#8892a6" stroke-width="1.3"/>
  <text x="32" y="212" font-family="Roboto Mono, monospace" font-size="12" fill="#333">{ "name": "duo" }</text>

  <rect x="500" y="178" width="444" height="56" rx="6" fill="none" stroke="#5b8def" stroke-width="1.3"/>
  <text x="516" y="212" font-family="Roboto Mono, monospace" font-size="12" fill="#333">{ name: "duo" }</text>

  <!-- 3 省略逗号 -->
  <text x="16" y="270" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7f6fe0">③ 分隔逗号</text>
  <rect x="16" y="280" width="440" height="72" rx="6" fill="none" stroke="#8892a6" stroke-width="1.3"/>
  <text x="32" y="306" font-family="Roboto Mono, monospace" font-size="12" fill="#333">{ "a": 1, "b": 2 }</text>
  <text x="32" y="330" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#c62828">✗ 末尾多写逗号会报错</text>

  <rect x="500" y="280" width="444" height="72" rx="6" fill="none" stroke="#5b8def" stroke-width="1.3"/>
  <text x="516" y="304" font-family="Roboto Mono, monospace" font-size="12" fill="#333">{ a: 1</text>
  <text x="516" y="324" font-family="Roboto Mono, monospace" font-size="12" fill="#333">  b: 2 }</text>
  <text x="620" y="324" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#5b8def">← 换行即可分隔</text>

  <!-- 4 多行字符串 -->
  <text x="16" y="386" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="700" fill="#7f6fe0">④ 多行字符串</text>
  <rect x="16" y="396" width="440" height="62" rx="6" fill="none" stroke="#8892a6" stroke-width="1.3"/>
  <text x="32" y="420" font-family="Roboto Mono, monospace" font-size="12" fill="#333">"desc": "第一行\n第二行"</text>
  <text x="32" y="442" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#c62828">✗ 只能靠 \n 拼接</text>

  <rect x="500" y="396" width="444" height="62" rx="6" fill="none" stroke="#5b8def" stroke-width="1.3"/>
  <text x="516" y="420" font-family="Roboto Mono, monospace" font-size="12" fill="#333">desc: '''</text>
  <text x="600" y="420" font-family="Roboto Mono, monospace" font-size="12" fill="#333">第一行</text>
  <text x="516" y="440" font-family="Roboto Mono, monospace" font-size="12" fill="#333">        第二行 '''</text>

  <!-- 小结 -->
  <text x="16" y="466" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8892a6">
    合法 JSON 一定是合法 HJSON；反之不成立。JSON → HJSON 零成本，HJSON → JSON 需规范化。
  </text>
</svg>
