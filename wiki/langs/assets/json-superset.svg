<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" width="960" height="320" role="img"
     aria-label="JSON 与 HJSON 的集合关系：JSON 是 HJSON 的子集，合法 JSON 同时是合法 HJSON">
  <title>JSON 与 HJSON 的集合关系</title>
  <desc>HJSON 是 JSON 的超集。任何合法 JSON 都是合法 HJSON，可原样交给 HJSON 解析器；HJSON 额外允许注释、无引号键名、省略逗号与多行字符串。</desc>

  <!-- 左：集合关系 -->
  <circle cx="290" cy="172" r="128" fill="#5b8def" fill-opacity="0.08" stroke="#5b8def" stroke-width="2"/>
  <circle cx="243" cy="172" r="74" fill="#7f6fe0" fill-opacity="0.16" stroke="#7f6fe0" stroke-width="2"/>
  <text x="366" y="78" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="18"
        font-weight="700" fill="#5b8def">HJSON</text>
  <text x="243" y="178" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="16"
        font-weight="700" fill="#7f6fe0" text-anchor="middle">JSON</text>

  <!-- 右：说明 -->
  <g font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="13.5">
    <text x="490" y="62" font-size="15" font-weight="700" fill="#5b8def">HJSON ＝ JSON ＋ 宽松语法</text>
    <text x="490" y="96" fill="#333">· 合法 JSON 一定是合法 HJSON</text>
    <text x="490" y="124" fill="#333">· 可直接交给 HJSON 解析器，无需改写</text>

    <text x="490" y="168" font-size="14" font-weight="700" fill="#7f6fe0">HJSON 额外允许</text>
    <text x="490" y="196" fill="#333">· 注释：<tspan font-family="Roboto Mono, monospace" fill="#7f6fe0">//</tspan>　<tspan font-family="Roboto Mono, monospace" fill="#7f6fe0">#</tspan>　<tspan font-family="Roboto Mono, monospace" fill="#7f6fe0">/* */</tspan></text>
    <text x="490" y="222" fill="#333">· 键名不加引号</text>
    <text x="490" y="248" fill="#333">· 省略逗号（以换行分隔）</text>
    <text x="490" y="274" fill="#333">· 三引号多行字符串</text>
  </g>

  <!-- 反向说明 -->
  <text x="490" y="304" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5" fill="#8892a6">
    反向不成立：用了 HJSON 特有语法的文件不是合法 JSON
  </text>

  <!-- 迁移方向 -->
  <g font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12">
    <text x="16" y="318" fill="#8892a6">迁移：JSON → HJSON 零成本（原文件直接可用）；HJSON → JSON 需去掉注释与宽松写法</text>
  </g>
</svg>
