<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img"
     aria-label="JSON 结构示意：对象由键值对组成，值可为字符串、数字、布尔、null、对象或数组">
  <title>JSON 结构示意</title>
  <desc>顶层为对象，花括号内是键值对；值可以是字符串、数字、布尔、null，也可以是嵌套的对象或数组。数组用方括号，元素按顺序排列。</desc>

  <!-- 左：源码 -->
  <text x="16" y="28" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#5b8def">JSON 文本</text>
  <rect x="16" y="42" width="470" height="272" rx="8" fill="none" stroke="#8892a6" stroke-width="1.5"/>
  <g font-family="Roboto Mono, 'Courier New', monospace" font-size="12.5">
    <text x="34" y="68" fill="#8892a6">{</text>
    <text x="52" y="92" fill="#7f6fe0">"name"</text><text x="128" y="92" fill="#8892a6">:</text>
    <text x="146" y="92" fill="#2e7d52">"duo"</text><text x="196" y="92" fill="#8892a6">,</text>
    <text x="52" y="116" fill="#7f6fe0">"health"</text><text x="140" y="116" fill="#8892a6">:</text>
    <text x="158" y="116" fill="#b26a00">260</text><text x="196" y="116" fill="#8892a6">,</text>
    <text x="52" y="140" fill="#7f6fe0">"targetAir"</text><text x="164" y="140" fill="#8892a6">:</text>
    <text x="182" y="140" fill="#c76fb8">true</text><text x="224" y="140" fill="#8892a6">,</text>
    <text x="52" y="164" fill="#7f6fe0">"icon"</text><text x="128" y="164" fill="#8892a6">:</text>
    <text x="146" y="164" fill="#c76fb8">null</text><text x="188" y="164" fill="#8892a6">,</text>

    <text x="52" y="192" fill="#7f6fe0">"requirements"</text><text x="188" y="192" fill="#8892a6">: [</text>
    <text x="76" y="216" fill="#8892a6">{</text>
    <text x="94" y="216" fill="#7f6fe0">"item"</text><text x="158" y="216" fill="#8892a6">:</text>
    <text x="176" y="216" fill="#2e7d52">"copper"</text><text x="248" y="216" fill="#8892a6">,</text>
    <text x="268" y="216" fill="#7f6fe0">"amount"</text><text x="344" y="216" fill="#8892a6">:</text>
    <text x="362" y="216" fill="#b26a00">35</text>
    <text x="76" y="240" fill="#8892a6">}</text>
    <text x="52" y="264" fill="#8892a6">]</text>
    <text x="34" y="292" fill="#8892a6">}</text>
  </g>

  <!-- 右：结构树 -->
  <text x="530" y="28" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="13" font-weight="700" fill="#7f6fe0">解析后的结构</text>
  <rect x="530" y="42" width="414" height="272" rx="8" fill="none" stroke="#8892a6" stroke-width="1.5"/>
  <g font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12.5">
    <text x="550" y="70" fill="#8892a6" font-weight="700">对象 { }</text>

    <text x="574" y="98" fill="#7f6fe0">name</text><text x="680" y="98" fill="#2e7d52">"duo"</text>
    <text x="760" y="98" fill="#8892a6" font-size="11">字符串</text>

    <text x="574" y="124" fill="#7f6fe0">health</text><text x="680" y="124" fill="#b26a00">260</text>
    <text x="760" y="124" fill="#8892a6" font-size="11">数字</text>

    <text x="574" y="150" fill="#7f6fe0">targetAir</text><text x="680" y="150" fill="#c76fb8">true</text>
    <text x="760" y="150" fill="#8892a6" font-size="11">布尔</text>

    <text x="574" y="176" fill="#7f6fe0">icon</text><text x="680" y="176" fill="#c76fb8">null</text>
    <text x="760" y="176" fill="#8892a6" font-size="11">空值</text>

    <text x="574" y="204" fill="#7f6fe0">requirements</text><text x="760" y="204" fill="#8892a6" font-size="11">数组</text>
    <text x="598" y="230" fill="#8892a6">[0] 对象</text>
    <text x="622" y="256" fill="#7f6fe0">item</text><text x="700" y="256" fill="#2e7d52">"copper"</text>
    <text x="622" y="280" fill="#7f6fe0">amount</text><text x="700" y="280" fill="#b26a00">35</text>
  </g>

  <!-- 底部：书写规则要点 -->
  <g font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="11.5" fill="#8892a6">
    <text x="16" y="334">键名必须加双引号 · 不能有尾随逗号 · 不支持注释 · 字符串中的特殊字符需转义</text>
  </g>
</svg>
