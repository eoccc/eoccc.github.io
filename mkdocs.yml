site_name: EOCC 文档库
site_url: https://docs.66131466.xyz/
site_description: Everyone Create Community
copyright: © Everyone Create Community（EOCC共创社区）

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  custom_dir: overrides
  palette:
    # 浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    # 深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

extra_css:
  - css/eocc-brand.css

extra_javascript:
  - js/eocc-version-check.js
  - js/eocc-image-zoom.js

markdown_extensions:
  - md_in_html
  - attr_list

nav:
  - 首页: index.md
  - 版本更新日志:
      - 更新日志总览: release.md
      - 完整日志列表: release/update.md
  - 开发者文档:
      - 总览: dev/index.md
