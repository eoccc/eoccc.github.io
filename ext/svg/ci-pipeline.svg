<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img"
     aria-label="云端 CI 流水线工作流：PR 提交到 main 仅执行构建校验并给出红叉或绿勾、不部署；合并入 main 后执行构建并自动部署到 GitHub Pages">
  <title>云端 CI 自动构建流水线工作流</title>
  <desc>工作流分两条触发路径。路径一：Pull Request 提交到 main，依次为在线编辑 Markdown 或 SVG、提交 PR、云端 mkdocs build --strict 构建校验，最后显示红叉或绿勾且不部署。路径二：代码 Push 合并进入 main，依次为审核合并、云端构建校验、用 actions/deploy-pages 部署到 GitHub Pages，最后站点自动上线。整体为预发布版本，优先推荐本地构建。</desc>

  <defs>
    <marker id="ciArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8892a6"/>
    </marker>
    <linearGradient id="ciPublish" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9a6fd0"/>
      <stop offset="100%" stop-color="#c76fb8"/>
    </linearGradient>
  </defs>

  <!-- 标题 -->
  <text x="16" y="30" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="15" font-weight="700" fill="#3a4254">云端 CI 自动构建流水线 · 两套触发逻辑</text>
  <text x="16" y="50" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11.5" fill="#8892a6">同一份 .github/workflows/docs-ci.yml，按事件类型区分：PR 只校验，合并才部署</text>

  <!-- ── 路径一：PR 触发 ──────────────────────────────────── -->
  <text x="16" y="86" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12" font-weight="700" fill="#5b8def">路径一 · Pull Request 提交到 main —— 仅校验，不部署</text>

  <rect x="16" y="98" width="124" height="64" rx="10" fill="#5b8def"/>
  <text x="78" y="124" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">① PR 触发</text>
  <text x="78" y="144" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">pull_request → main</text>

  <line x1="140" y1="130" x2="152" y2="130" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="156" y="98" width="180" height="64" rx="10" fill="#6f7ae5"/>
  <text x="246" y="124" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">在线编辑 md / SVG</text>
  <text x="246" y="144" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">网页直接改，无需本地环境</text>

  <line x1="336" y1="130" x2="348" y2="130" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="356" y="98" width="180" height="64" rx="10" fill="#7f6fe0"/>
  <text x="446" y="124" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">提交 Pull Request</text>
  <text x="446" y="144" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">新建分支并发起 PR</text>

  <line x1="536" y1="130" x2="548" y2="130" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="556" y="98" width="180" height="64" rx="10" fill="#9a6fd0"/>
  <text x="646" y="124" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">云端构建校验</text>
  <text x="646" y="144" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">mkdocs build --strict</text>

  <line x1="736" y1="130" x2="748" y2="130" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="756" y="98" width="188" height="64" rx="10" fill="none" stroke="#5b8def" stroke-width="2"/>
  <text x="850" y="122" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#5b8def">✓ 绿勾通过 / ✗ 红叉失败</text>
  <text x="850" y="144" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#8892a6">不部署 · 失败可阻止合并</text>

  <!-- ── 路径二：Push 合并 ────────────────────────────────── -->
  <text x="16" y="206" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12" font-weight="700" fill="#c76fb8">路径二 · 代码 Push 合并进入 main —— 构建成功后自动部署</text>

  <rect x="16" y="218" width="124" height="64" rx="10" fill="#c76fb8"/>
  <text x="78" y="244" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">② Push 合并</text>
  <text x="78" y="264" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#fdeef8">push → main</text>

  <line x1="140" y1="250" x2="152" y2="250" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="156" y="218" width="180" height="64" rx="10" fill="#9a6fd0"/>
  <text x="246" y="244" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">审核合并入 main</text>
  <text x="246" y="264" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">维护者审核通过</text>

  <line x1="336" y1="250" x2="348" y2="250" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="356" y="218" width="180" height="64" rx="10" fill="#b06fc8"/>
  <text x="446" y="244" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">云端构建 + 校验</text>
  <text x="446" y="264" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#eef2ff">锁定版本 1.6.1 / 9.7.7</text>

  <line x1="536" y1="250" x2="548" y2="250" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="556" y="218" width="180" height="64" rx="10" fill="url(#ciPublish)"/>
  <text x="646" y="244" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">部署到 GitHub Pages</text>
  <text x="646" y="264" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#fdeef8">actions/deploy-pages</text>

  <line x1="736" y1="250" x2="748" y2="250" stroke="#8892a6" stroke-width="2" marker-end="url(#ciArrow)"/>

  <rect x="756" y="218" width="188" height="64" rx="10" fill="#c76fb8"/>
  <text x="850" y="244" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="12.5" font-weight="700" fill="#ffffff">站点自动上线</text>
  <text x="850" y="264" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="10.5" fill="#fdeef8">docs.66131466.xyz</text>

  <!-- ── 汇合说明：共同前置 ──────────────────────────────── -->
  <rect x="16" y="304" width="440" height="52" rx="10" fill="#ffffff" stroke="#dde3ee" stroke-width="1.5"/>
  <text x="32" y="326" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11.5" font-weight="700" fill="#5b8def">两条路径共用的构建内容</text>
  <text x="32" y="346" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#8892a6">检出 → 装锁定版本 → --strict 构建 → 修 sitemap → 叠加仓库独有文件</text>

  <rect x="472" y="304" width="472" height="52" rx="10" fill="#ffffff" stroke="#dde3ee" stroke-width="1.5"/>
  <text x="488" y="326" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11.5" font-weight="700" fill="#c76fb8">叠加的仓库独有文件（构建不会生成）</text>
  <text x="488" y="346" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#8892a6">CNAME · BingSiteAuth.xml · data/ · release/update/ · img/user/</text>

  <!-- ── 预发布声明 ──────────────────────────────────────── -->
  <rect x="16" y="372" width="928" height="52" rx="10" fill="#c76fb8" opacity="0.10"/>
  <rect x="16" y="372" width="4" height="52" rx="2" fill="#c76fb8"/>
  <text x="34" y="394" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11.5" font-weight="700" fill="#c76fb8">【预发布版本 · 系统不稳定】</text>
  <text x="34" y="414" font-family="Roboto, 'Segoe UI', Arial, sans-serif"
        font-size="11" fill="#8892a6">仍需长期测试、反复迭代修改与校验实际输出内容，不保证结果完全无误；现阶段优先推荐本地构建，也可自行修改流水线配置测试。</text>
</svg>
