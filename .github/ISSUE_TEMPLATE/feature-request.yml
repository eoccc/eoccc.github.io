name: 内容或结构建议
description: 建议新增教程、调整章节结构、补充图示或改进站点组织方式
title: "[建议] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出改进建议。若你的建议涉及站点结构或导航，
        可先阅读[导航与站点配置](https://docs.66131466.xyz/dev/nav-config/)了解现有组织方式。

  - type: dropdown
    id: kind
    attributes:
      label: 建议类型
      options:
        - 新增教程或章节
        - 调整现有章节结构
        - 补充图示（流程图 / 架构图 / 示意图）
        - 改进导航或站点组织
        - 补充示例或代码片段
        - 其他
    validations:
      required: true

  - type: input
    id: scope
    attributes:
      label: 涉及板块
      description: 该建议面向哪个板块；若为全新内容可写「新增」
      placeholder: 例如 开发者文档 / 版本更新日志 / 全新板块
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 说明当前的不足或使用中的困惑
      placeholder: 读者在什么场景下会遇到困难？现有文档哪里不够？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望补充或调整成什么样
    validations:
      required: true

  - type: textarea
    id: refs
    attributes:
      label: 参考资料
      description: 相关链接、同类站点做法等（可选）
    validations:
      required: false
